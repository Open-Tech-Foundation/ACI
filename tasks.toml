# Tasks for `tsr`.
#
# Every task runs from this directory, and that is not incidental: esdev jails
# the filesystem to the directory it is started in, and the demo imports the
# engine from ../../src. Run `esdev test` inside demo/ and that import escapes
# the sandbox and fails. Rooting every task here keeps the jail wide enough to
# contain both packages — which is also why there is no [workspace] block, since
# per-package tasks would re-introduce the problem.

[tasks.test]
run = "esdev test"

# The basics, as transcripts. Takes a category or several — `tsr basics state
# space` — and runs every one of them given none.
[tasks.basics]
run = "esdev tests/run.mjs"

# The dev loop runs from here, not from demo/: esdev watches the directory its
# config sits in, and the brain is in src/. Rooted in demo/ it watched demo/
# alone, so an engine change never rebuilt and the page kept answering out of
# the last bundle.
[tasks.dev]
run = "esdev start"

[tasks.server]
deps = ["dev"]

[tasks.build]
run = "esdev build --lib src --out=dist"

[tasks.site]
run = "esdev build --minify"

[tasks.ci]
deps = ["basics", "test", "build"]

# What the conversation holds, as the graph says it.
[tasks.graph]
run = "esdev graph.mjs"

# What the brain composed to reach an answer, as nested calls.
[tasks.compose]
run = "esdev compose.mjs"
